# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Three resources:
#   cardio-sense       the React site (static)
#   cardio-sense-api   the Django API (Python web service, gunicorn)
#   cardio-sense-db    PostgreSQL for accounts, profiles and assessments
#
# The site uses the real API and model (VITE_USE_MOCK_API=false). Its /api/*
# rewrite keeps the API on the site's own origin, so the session and CSRF
# cookies work with no CORS setup (as the Vite proxy does in development).
#
# Secrets are never in this file. Every `sync: false` variable below is entered
# once in the Render dashboard (cardio-sense-api → Environment): the admin
# account, the sign-in providers' app keys and the email settings. See
# "Deploying on Render" in README.md.
#
# Render gave the site the address https://cardio-sense-ro4n.onrender.com
# (the plain name was taken by another app). The API must be told this exact
# address (FRONTEND_URL below): it only accepts the app's requests from it,
# and OAuth and password-reset links lead back to it.

services:
  - type: web
    runtime: static
    name: cardio-sense
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_USE_MOCK_API
        value: "false"
    routes:
      # The API, through the site's own origin. Must come before the catch-all.
      - type: rewrite
        source: /api/*
        destination: https://cardio-sense-api.onrender.com/api/*
      # Client-side routing: /prediction, /history and /about load the app.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite fingerprints everything in /assets, so it can be cached for good.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: same-origin

  - type: web
    runtime: python
    name: cardio-sense-api
    plan: free
    autoDeployTrigger: commit
    # The API reads the model from ml/artifacts, so it builds from the repository root.
    buildCommand: >-
      pip install -r backend/requirements.txt &&
      cd backend &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py createcachetable &&
      python manage.py ensure_admin
    # One worker process with threads: each process holds the model, SHAP and
    # pandas (~370 MB measured), so two processes overflowed the free plan's
    # 512 MB and Render restarted the service. Threads share one copy.
    # The first prediction after a start builds the explainer (~20-40 s on the
    # free CPU), hence the long timeout.
    startCommand: cd backend && gunicorn config.wsgi --workers 1 --threads 4 --timeout 180
    healthCheckPath: /api/connect/
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.6"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Fewer glibc memory arenas: keeps the threaded worker's memory from
      # fragmenting upwards over time (a common fix for 512 MB instances).
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: cardio-sense-db
          property: connectionString
      # The site the API sends people back to (OAuth, password-reset links).
      - key: FRONTEND_URL
        value: https://cardio-sense-ro4n.onrender.com
      - key: OAUTH_REDIRECT_BASE
        value: https://cardio-sense-ro4n.onrender.com
      # ---- Set in the dashboard, never in this file ----
      # The admin account, created on the first deploy (manage.py ensure_admin).
      # Later deploys never reset its password; change it in the app.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      # Sign-in and account linking: each provider's app keys. Register the
      # callback https://cardio-sense-ro4n.onrender.com/api/connect/<gmail|x|facebook|linkedin>/callback/
      # in that provider's console. A provider left empty shows as "not set up".
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      # Password-reset email (SMTP). Without EMAIL_HOST, reset links are only logged.
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  # Purges profiles past their 10-minute undo window (they're also purged on the
  # next API call). Cron jobs are a paid Render service: uncomment to use one.
  # - type: cron
  #   runtime: python
  #   name: cardio-sense-purge
  #   schedule: "*/15 * * * *"
  #   buildCommand: pip install -r backend/requirements.txt
  #   startCommand: cd backend && python manage.py purge_deleted_profiles
  #   envVars:
  #     - key: PYTHON_VERSION
  #       value: "3.14.6"
  #     - key: DJANGO_SECRET_KEY
  #       fromService: { type: web, name: cardio-sense-api, envVarKey: DJANGO_SECRET_KEY }
  #     - key: DATABASE_URL
  #       fromDatabase: { name: cardio-sense-db, property: connectionString }

databases:
  - name: cardio-sense-db
    plan: free
    databaseName: cardio_sense
    user: cardio_sense
