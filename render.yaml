# Render Blueprint: https://render.com/docs/blueprint-spec
#
# The frontend deploys as a free static site. The Django API (now with user
# accounts) isn't deployed yet, so the hosted site uses the in-browser mock
# (VITE_USE_MOCK_API=true), which keeps each account's data in the browser.
services:
  - type: web
    runtime: static
    name: cardio-sense
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_USE_MOCK_API
        value: "true"
    routes:
      # Client-side routing: /prediction, /history and /about load the app.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite fingerprints everything in /assets, so it can be cached for good.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
